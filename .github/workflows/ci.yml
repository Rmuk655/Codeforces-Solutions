name: CI
on: [push, pull_request]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that every solution compiles
        run: |
          fail=0
          for f in *.cpp; do
            g++ -std=c++17 -fsyntax-only "$f" || { echo "FAILED: $f"; fail=1; }
          done
          exit $fail
